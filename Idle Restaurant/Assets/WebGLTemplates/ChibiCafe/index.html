<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="Stack fast. Serve faster. A cozy, chaotic burger cafe.">
    <meta name="theme-color" content="{{{ BACKGROUND_COLOR }}}">
    <link rel="icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <!-- Chibi Burger Cafe: the game opens at any window (or iframe) size, always at its own shape (16:10, the
         shape it was made for): as large as fits, centred, the rest of the page in the game's background
         colour. It follows the window when that changes size. No footer and no fullscreen button. -->
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <!-- The loading screen is the game's own: its icon, its name, a pill progress bar in its teal. -->
      <div id="unity-loading-bar">
        <img id="chibi-icon" src="TemplateData/chibi-icon.png" alt="">
        <div id="chibi-name">Chibi Burger Cafe</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="chibi-status">Warming up the kitchen...</div>
      </div>
      <div id="unity-warning"> </div>
#if SHOW_DIAGNOSTICS
      <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
    </div>
    <script>
      // Chibi Burger Cafe: frame limiter (battery). The game runs at most window.chibiMaxFps frames a
      // second, whatever the screen's refresh rate: requestAnimationFrame callbacks are skipped at vsync
      // until enough time has passed. The game sets the cap (PerformanceGovernor via ChibiPerf.jslib):
      // 30 on phones, 60 on computers, 30 in menus.
      (function () {
        var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        window.chibiMaxFps = phone ? 30 : 60;
        var raf = window.requestAnimationFrame.bind(window);
        var last = 0;
        window.requestAnimationFrame = function (callback) {
          return raf(function tick(now) {
            if (now - last >= 1000 / window.chibiMaxFps - 2) {
              last = now;
              callback(now);
            } else {
              raf(tick);
            }
          });
        };
      })();

      var canvas = document.querySelector("#unity-canvas");

      // Keep 16:10 whatever the window: the biggest 16:10 box that fits, centred.
      var ASPECT = {{{ WIDTH }}} / {{{ HEIGHT }}};
      function fitCanvas() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > ASPECT) w = Math.round(h * ASPECT); else h = Math.round(w / ASPECT);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Chibi Burger Cafe: phones report 2-3 device pixels per CSS pixel; rendering all of them
        // made phones hot. 1.5 keeps text and edges crisp at a fraction of the pixels.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          // Downloading is most of the wait; the last stretch is the engine starting up.
          if (progress >= 0.9) document.querySelector("#chibi-status").textContent = "Lighting the stove...";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
                document.getElementById("diagnostics-icon").onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
                };
#endif

#if DEVELOPMENT_PLAYER
                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-container").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                // A friendly card instead of the browser's alert box.
                document.querySelector("#chibi-status").textContent = "The kitchen couldn't open. Please reload the page.";
                document.querySelector("#unity-progress-bar-empty").style.display = "none";
                console.error(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
